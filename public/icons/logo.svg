<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Plate: тарелка сверху, по ободу — кольцо БЖУ (белки, жиры, углеводы), на тарелке стейк, гарнир и зелень -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f1ec"/>
    </radialGradient>
    <radialGradient id="well" cx="50%" cy="58%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f6f3"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#064e1f" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Тарелка -->
  <circle cx="512" cy="512" r="356" fill="url(#plate)" filter="url(#shadow)"/>
  <circle cx="512" cy="512" r="236" fill="url(#well)" stroke="#dbe7df" stroke-width="5"/>

  <!-- Кольцо БЖУ по ободу -->
  <g fill="none" stroke-width="48" stroke-linecap="round" transform="rotate(-90 512 512)">
    <circle cx="512" cy="512" r="296" pathLength="100" stroke="#5e5ce6" stroke-dasharray="25 75" stroke-dashoffset="-4"/>
    <circle cx="512" cy="512" r="296" pathLength="100" stroke="#ff9f0a" stroke-dasharray="20 80" stroke-dashoffset="-37"/>
    <circle cx="512" cy="512" r="296" pathLength="100" stroke="#32ade6" stroke-dasharray="28 72" stroke-dashoffset="-65"/>
  </g>

  <!-- Еда на тарелке: стейк, картофельные дольки, помидор черри и листик зелени -->
  <defs>
    <clipPath id="steakClip">
      <path d="M318 560 C 316 488 384 452 458 458 C 534 464 580 506 572 570 C 564 636 488 668 410 654 C 352 643 320 610 318 560 Z"/>
    </clipPath>
    <linearGradient id="steak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="potato" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="tomato" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#dc2626"/>
    </radialGradient>
  </defs>

  <!-- Стейк: жировая кромка, мясо, полоски гриля -->
  <path d="M304 562 C 300 480 378 438 460 444 C 544 450 594 498 586 570 C 578 646 494 684 406 668 C 342 656 306 618 304 562 Z" fill="#f3d2bd"/>
  <path d="M318 560 C 316 488 384 452 458 458 C 534 464 580 506 572 570 C 564 636 488 668 410 654 C 352 643 320 610 318 560 Z" fill="url(#steak)"/>
  <g clip-path="url(#steakClip)" stroke="#431407" stroke-width="16" stroke-linecap="round" opacity=".55">
    <path d="M340 520 L 470 650"/>
    <path d="M400 470 L 548 618"/>
    <path d="M470 452 L 590 572"/>
  </g>
  <path d="M352 520 C 380 488 430 476 470 480" fill="none" stroke="#fdba74" stroke-width="10" stroke-linecap="round" opacity=".55"/>

  <!-- Картофельные дольки горкой: мякоть и корочка -->
  <g>
    <g transform="translate(612 402) rotate(-12)">
      <path d="M-58 0 A 58 44 0 0 1 58 0 Z" fill="url(#potato)"/>
      <path d="M-58 0 A 58 44 0 0 1 58 0" fill="none" stroke="#a16207" stroke-width="11" stroke-linecap="round"/>
      <path d="M-30 -14 Q 0 -26 26 -16" fill="none" stroke="#fef3c7" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    </g>
    <g transform="translate(676 470) rotate(48)">
      <path d="M-58 0 A 58 44 0 0 1 58 0 Z" fill="url(#potato)"/>
      <path d="M-58 0 A 58 44 0 0 1 58 0" fill="none" stroke="#a16207" stroke-width="11" stroke-linecap="round"/>
      <path d="M-30 -14 Q 0 -26 26 -16" fill="none" stroke="#fef3c7" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    </g>
    <g transform="translate(606 488) rotate(-28)">
      <path d="M-58 0 A 58 44 0 0 1 58 0 Z" fill="url(#potato)"/>
      <path d="M-58 0 A 58 44 0 0 1 58 0" fill="none" stroke="#a16207" stroke-width="11" stroke-linecap="round"/>
      <path d="M-30 -14 Q 0 -26 26 -16" fill="none" stroke="#fef3c7" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    </g>
  </g>

  <!-- Помидор черри -->
  <circle cx="640" cy="588" r="40" fill="url(#tomato)"/>
  <path d="M640 552 l 9 14 l 16 -4 l -8 14 l 12 10 l -16 2 l -13 -10 l -13 10 l -16 -2 l 12 -10 l -8 -14 l 16 4 Z" fill="#16a34a"/>
  <circle cx="626" cy="578" r="9" fill="#ffffff" opacity=".55"/>

  <!-- Листик зелени -->
  <g transform="translate(418 392) scale(.62) rotate(-40) translate(-512 -510)">
    <path d="M512 640 L 512 668" stroke="#15803d" stroke-width="14" stroke-linecap="round"/>
    <path d="M512 380 C 600 430 612 540 512 640 C 412 540 424 430 512 380 Z" fill="url(#leaf)"/>
    <path d="M512 410 L 512 615" stroke="#dcfce7" stroke-width="12" stroke-linecap="round" opacity=".85"/>
    <path d="M512 470 L 548 444 M512 520 L 556 490 M512 470 L 476 444 M512 520 L 468 490"
          stroke="#dcfce7" stroke-width="9" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
