<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plate</title>
  <meta name="description" content="Portion sizes in grams for your daily calorie and macro targets">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <!-- iOS: launch as a standalone app from the home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plate">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Skeleton of the first screen until the data is loaded (main.js removes it); appears only if loading
       takes a while. The screen in the URL (e.g. reopened after an update reload) is picked by the script below -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="app skeleton" data-for="days">
      <div class="skeleton__nav"><span class="skeleton__brand"><i class="skeleton__logo"></i><i class="skeleton__line" style="width:72px"></i></span><span class="skeleton__brand"><i class="skeleton__dot"></i><i class="skeleton__dot"></i></span></div>
      <i class="skeleton__title"></i>
      <i class="skeleton__line" style="width:40%"></i>
      <ul class="skeleton__group">
        <li class="skeleton__row"><i class="skeleton__tile"></i><span class="skeleton__lines"><i style="width:45%"></i><i style="width:70%"></i></span><i class="skeleton__ring"></i></li>
        <li class="skeleton__row"><i class="skeleton__tile"></i><span class="skeleton__lines"><i style="width:45%"></i><i style="width:70%"></i></span><i class="skeleton__ring"></i></li>
        <li class="skeleton__row"><i class="skeleton__tile"></i><span class="skeleton__lines"><i style="width:45%"></i><i style="width:70%"></i></span><i class="skeleton__ring"></i></li>
        <li class="skeleton__row"><i class="skeleton__tile"></i><span class="skeleton__lines"><i style="width:45%"></i><i style="width:70%"></i></span><i class="skeleton__ring"></i></li>
      </ul>
      <i class="skeleton__line" style="width:40%"></i>
      <ul class="skeleton__group">
        <li class="skeleton__row"><i class="skeleton__tile"></i><span class="skeleton__lines"><i style="width:45%"></i><i style="width:70%"></i></span><i class="skeleton__ring"></i></li>
        <li class="skeleton__row"><i class="skeleton__tile"></i><span class="skeleton__lines"><i style="width:45%"></i><i style="width:70%"></i></span><i class="skeleton__ring"></i></li>
        <li class="skeleton__row"><i class="skeleton__tile"></i><span class="skeleton__lines"><i style="width:45%"></i><i style="width:70%"></i></span><i class="skeleton__ring"></i></li>
      </ul>
    </div>
    <div class="app skeleton" data-for="day">
      <div class="skeleton__nav"><i class="skeleton__line" style="width:64px"></i><i class="skeleton__dot"></i></div>
      <i class="skeleton__title"></i>
      <i class="skeleton__line" style="width:55%"></i>
      <div class="skeleton__group skeleton__summary"><i class="skeleton__bigring"></i><span class="skeleton__bars"><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
      <div class="skeleton__group skeleton__row"><i class="skeleton__line" style="width:30%;margin:0"></i></div>
      <i class="skeleton__heading"></i>
      <ul class="skeleton__group">
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:55%"></i><i style="width:35%"></i></span><i class="skeleton__value"></i></li>
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:55%"></i><i style="width:35%"></i></span><i class="skeleton__value"></i></li>
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:55%"></i><i style="width:35%"></i></span><i class="skeleton__value"></i></li>
      </ul>
    </div>
    <div class="app skeleton" data-for="dish">
      <div class="skeleton__nav"><i class="skeleton__line" style="width:64px"></i><i class="skeleton__dot"></i></div>
      <i class="skeleton__title"></i>
      <ul class="skeleton__group">
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:55%"></i><i style="width:35%"></i></span><i class="skeleton__value"></i></li>
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:55%"></i><i style="width:35%"></i></span><i class="skeleton__value"></i></li>
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:55%"></i><i style="width:35%"></i></span><i class="skeleton__value"></i></li>
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:55%"></i><i style="width:35%"></i></span><i class="skeleton__value"></i></li>
      </ul>
    </div>
    <div class="app skeleton" data-for="dishes">
      <div class="skeleton__nav"></div>
      <i class="skeleton__title"></i>
      <ul class="skeleton__group">
        <li class="skeleton__row"><i class="skeleton__tile"></i><span class="skeleton__lines"><i style="width:50%"></i><i style="width:75%"></i></span></li>
        <li class="skeleton__row"><i class="skeleton__tile"></i><span class="skeleton__lines"><i style="width:50%"></i><i style="width:75%"></i></span></li>
        <li class="skeleton__row"><i class="skeleton__tile"></i><span class="skeleton__lines"><i style="width:50%"></i><i style="width:75%"></i></span></li>
        <li class="skeleton__row"><i class="skeleton__tile"></i><span class="skeleton__lines"><i style="width:50%"></i><i style="width:75%"></i></span></li>
      </ul>
    </div>
    <div class="app skeleton" data-for="products">
      <div class="skeleton__nav"></div>
      <i class="skeleton__title"></i>
      <i class="skeleton__search"></i>
      <div class="skeleton__chips"><i></i><i></i><i></i><i></i></div>
      <i class="skeleton__line" style="width:25%"></i>
      <ul class="skeleton__group">
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:60%"></i><i style="width:40%"></i></span></li>
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:60%"></i><i style="width:40%"></i></span></li>
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:60%"></i><i style="width:40%"></i></span></li>
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:60%"></i><i style="width:40%"></i></span></li>
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:60%"></i><i style="width:40%"></i></span></li>
        <li class="skeleton__row"><i class="skeleton__tile skeleton__tile--sm"></i><span class="skeleton__lines"><i style="width:60%"></i><i style="width:40%"></i></span></li>
      </ul>
    </div>
    <div class="skeleton skeleton__tabbar"><i class="skeleton__dot"></i><i class="skeleton__dot"></i><i class="skeleton__dot"></i></div>
  </div>
  <script>
    {
      const screen = location.hash.match(/^#\/(day|dish|dishes|products)\b/);
      if (screen) document.getElementById('splash').dataset.view = screen[1];
    }
  </script>
  <div id="app"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
